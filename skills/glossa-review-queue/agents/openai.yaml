interface:
  display_name: "Glossa Review Queue"
  short_description: "Resolve merge, translation and rule tasks"
  default_prompt: "Use $glossa-review-queue to claim my open Glossa tasks, resolve the clear ones with reasons and list the ones that need me."
dependencies:
  tools:
    - type: "mcp"
      value: "glossa"
      description: "Glossa hosted MCP server"
      transport: "streamable_http"
      url: "https://getglossa.dev/api/mcp"
policy:
  allow_implicit_invocation: true
