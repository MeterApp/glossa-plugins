interface:
  display_name: "Glossa"
  short_description: "Push, translate and pull app strings"
  default_prompt: "Use $glossa to push this repository's source translation file, translate the missing locales and pull the finished files back."
dependencies:
  tools:
    - type: "mcp"
      value: "glossa"
      description: "Glossa hosted MCP server"
      transport: "streamable_http"
      url: "https://getglossa.dev/api/mcp"
policy:
  allow_implicit_invocation: true
